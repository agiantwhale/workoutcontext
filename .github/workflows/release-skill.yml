name: Release skill zip (rolling latest)

# Builds `workout-context.zip` from `assets/skills/workout-context/` and
# publishes it as the rolling `latest` GitHub release on every push to main.
# Users point their MCP client at the latest release URL and always get the
# skill packaged from the current main branch.
#
# Lifecycle on each fire:
#   1. zip the skill directory directly (the source dir name already matches
#      the SKILL.md frontmatter `name:` field, so the archive extracts under
#      the canonical `workout-context/` directory with no staging step)
#   2. delete the existing `latest` release + tag (if any)
#   3. create a fresh `latest` release pinned to the just-pushed commit, with
#      the zip attached and `--latest` so GitHub shows it as the latest release
#
# Manual trigger is wired up too (workflow_dispatch) so the maintainer can
# rebuild the release without an empty commit. Other branches do nothing —
# staging and PR branches deliberately don't publish, since a downloader who
# clicks "latest" expects something that's been merged.

on:
  push:
    branches:
      - main
    paths:
      - "assets/skills/workout-context/**"
      - ".github/workflows/release-skill.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-skill-latest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify skill scaffold
        run: |
          set -euo pipefail
          test -f assets/skills/workout-context/SKILL.md
          head -1 assets/skills/workout-context/SKILL.md | grep -q '^---$'
          grep -q '^name: workout-context$' assets/skills/workout-context/SKILL.md

      - name: Zip
        run: |
          set -euo pipefail
          (cd assets/skills && zip -r "$GITHUB_WORKSPACE/workout-context.zip" workout-context -x '*.DS_Store')
          unzip -l workout-context.zip

      - name: Replace rolling `latest` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Delete prior release + tag if they exist. `|| true` because the
          # very first run won't have a `latest` to delete.
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest workout-context.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest skill build (main)" \
            --latest \
            --notes "Skill zip built from main @ \`${GITHUB_SHA}\`.

          Download \`workout-context.zip\` and add it to your MCP client (Claude Code, Claude Desktop, etc.). The archive extracts to a \`workout-context/\` directory containing \`SKILL.md\` and the playbook reference templates.

          This release is overwritten on every push to \`main\` — bookmark the [latest release URL](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/workout-context.zip) for a stable download link."
